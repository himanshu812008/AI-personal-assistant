{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">Task manager</p><h1>Edit task</h1></div></header><article class="panel narrow"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required value="{{task.title}}"></label><label>Description<textarea name="description">{{task.description}}</textarea></label><div class="form-grid"><label>Priority<select name="priority">{% for p in ['high','medium','low'] %}<option value="{{p}}" {% if task.priority==p %}selected{% endif %}>{{p|title}}</option>{% endfor %}</select></label><label>Deadline<input type="date" name="due_date" value="{{task.due_date or ''}}"></label></div><button>Save changes</button> <a class="text-button" href="{{url_for('tasks')}}">Cancel</a></form></article>{% endblock %}
